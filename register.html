<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
<form method="POST">
    {{ form.hidden_tag() }}

    {{ form.name.label }} {{ form.name() }}<br>
    {{ form.emailid.label }} {{ form.emailid() }}<br>
    {{ form.phonenumber.label }} {{ form.phonenumber() }}<br>
    {{ form.password.label }} {{ form.password() }}<br>
    {{ form.confirmpassword.label }} {{ form.confirmpassword() }}<br>

    <input type="submit" value="Register">
</form>
</body>
</html>
